<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KI-Magazin – Nachrichten aus der KI-Welt</title>
  <meta name="description" content="Täglich die wichtigsten Nachrichten aus der KI-Welt, gesammelt aus Quellen weltweit und auf Deutsch zusammengefasst.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <div>
        <a href="./" class="logo" id="site-name">KI-Magazin</a>
        <p class="tagline" id="site-tagline">Die KI-Welt, täglich auf Deutsch.</p>
      </div>
      <div class="edition">
        <span id="edition-date">–</span>
        <span id="edition-count" class="muted"></span>
      </div>
    </div>
    <nav class="wrap rubrics" id="rubrics" aria-label="Rubriken"></nav>
  </header>

  <main class="wrap">
    <section id="briefing" class="briefing" aria-labelledby="briefing-title" hidden>
      <h2 id="briefing-title" class="section-title">Das Briefing des Tages</h2>
      <p id="briefing-text" class="briefing-text"></p>
    </section>

    <section id="top" class="top-stories" aria-label="Top-Meldungen"></section>

    <section aria-labelledby="all-title">
      <div class="list-head">
        <h2 id="all-title" class="section-title">Alle Meldungen</h2>
        <input id="search" type="search" placeholder="Suchen …" aria-label="Meldungen durchsuchen">
      </div>
      <div id="list" class="list"></div>
      <p id="empty" class="empty" hidden>Keine Meldungen gefunden.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p>Alle Meldungen sind eigene Zusammenfassungen. Die Originalquelle ist jeweils verlinkt.</p>
      <p><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
